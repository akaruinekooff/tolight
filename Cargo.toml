[package]
name = "tolight"
version = "0.1.0"
edition = "2024"
description = "A terminal-based (TUI) todo list manager for developers with per-project todo files"
authors = ["George Kulikov"]
license = "MIT"
repository = "https://github.com/akaruinekooff/tolight"
keywords = ["todo", "tui", "terminal", "project-management", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29.0"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
